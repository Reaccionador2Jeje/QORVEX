name: F-Droid offline build guards

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-guards:
    name: Validate offline build guard scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell syntax and offline guards
        run: bash tools/test-offline-build-mode.sh
